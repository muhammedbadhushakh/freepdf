<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reverse Page Order | FreemiumPDF</title>
<meta name="description" content="Reverse the page order of a PDF in one click, free and in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/pdftool.css">
<link rel="canonical" href="https://freemiumpdf.netlify.app/tools/pdf-tools/reverse-pages.html">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="https://freemiumpdf.netlify.app/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/global-footer.css">
</head>
<body data-tool="reverse">
<div class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand-link"><span class="brand-mark"><i class="fa-solid fa-wrench"></i></span> FreemiumPDF</a>
    <span class="crumb">/ PDF Tools / Reverse Page Order</span>
  </div>
</div>
<main class="page-wrap" style="max-width:1100px;">
  <div class="calc-head">
    <h1>Reverse Page Order</h1>
    <p>Flip the entire page order of your PDF, last page first.</p>
  </div>
  <div class="calc-layout">
    <div class="calc-card">
<div class="dropzone" id="dropzone">
  <i class="fa-solid fa-file-arrow-up" style="font-size:28px;color:var(--blue-600);margin-bottom:10px;"></i>
  <p><strong>Click to upload</strong> or drag &amp; drop a PDF file</p>
  <button type="button" class="dropzone-browse-btn">Browse Files</button>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
</div>
<div class="file-info" id="fileInfo" style="display:none;">
  <i class="fa-solid fa-file-pdf" style="color:var(--red)"></i>
  <span id="fileName"></span>
  <button class="remove" id="removeFile">Remove</button>
</div>

  <div id="opts" style="display:none;">
    <button class="calc-btn" id="runBtn" style="display:none;">Reverse page order</button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<div class="download-box" id="downloadBox">
  <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
  <span class="name" id="downloadName">Ready</span>
  <a id="downloadLink" download>Download</a>
</div>

    </div>
    <aside class="side-card" id="calcSidebar"></aside>
  </div>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/pdftool-common.js"></script>
<script>
  let bytes = null;
  setupDropzone('dropzone','fileInput', async (file) => {
    document.getElementById('fileInfo').style.display='flex';
    document.getElementById('fileName').textContent = file.name + ' • ' + formatBytes(file.size);
    document.getElementById('dropzone').style.display='none';
    bytes = await file.arrayBuffer();
    document.getElementById('opts').style.display='block';
    document.getElementById('runBtn').click();
  });
  document.getElementById('removeFile').addEventListener('click', () => location.reload());
  document.getElementById('runBtn').addEventListener('click', async () => {
    const bar = document.getElementById('progressBar'); document.getElementById('progressFill').style.width='40%'; bar.classList.add('show');
    const srcDoc = await PDFLib.PDFDocument.load(bytes);
    const n = srcDoc.getPageCount();
    const revIndices = Array.from({length:n}, (_,i)=>n-1-i);
    const newDoc = await PDFLib.PDFDocument.create();
    const pages = await newDoc.copyPages(srcDoc, revIndices);
    pages.forEach(p => newDoc.addPage(p));
    const out = await newDoc.save();
    document.getElementById('progressFill').style.width='100%';
    const blob = new Blob([out], {type:'application/pdf'});
    triggerDownload(blob, 'reversed.pdf');
    document.getElementById('downloadBox').classList.add('show');
    document.getElementById('downloadName').textContent = 'reversed.pdf';
    document.getElementById('downloadLink').href = URL.createObjectURL(blob);
  });
  </script>
</body>
</html>
