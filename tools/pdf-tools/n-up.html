<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>N-up (Multiple Pages per Sheet) | FreemiumPDF</title>
<meta name="description" content="Print 2, 4, 6 or 9 PDF pages per sheet, free and in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/pdftool.css">
<link rel="canonical" href="https://freemiumpdf.netlify.app/tools/pdf-tools/n-up.html">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="https://freemiumpdf.netlify.app/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/global-footer.css">
</head>
<body data-tool="nup">
<div class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand-link"><span class="brand-mark"><i class="fa-solid fa-wrench"></i></span> FreemiumPDF</a>
    <span class="crumb">/ PDF Tools / N-up (Multiple Pages per Sheet)</span>
  </div>
</div>
<main class="page-wrap" style="max-width:1100px;">
  <div class="calc-head">
    <h1>N-up (Multiple Pages per Sheet)</h1>
    <p>Combine several PDF pages onto a single printed sheet.</p>
  </div>
  <div class="calc-layout">
    <div class="calc-card">
<div class="dropzone" id="dropzone">
  <i class="fa-solid fa-file-arrow-up" style="font-size:28px;color:var(--blue-600);margin-bottom:10px;"></i>
  <p><strong>Click to upload</strong> or drag &amp; drop a PDF file</p>
  <button type="button" class="dropzone-browse-btn">Browse Files</button>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
</div>
<div class="file-info" id="fileInfo" style="display:none;">
  <i class="fa-solid fa-file-pdf" style="color:var(--red)"></i>
  <span id="fileName"></span>
  <button class="remove" id="removeFile">Remove</button>
</div>

  <div id="opts" style="display:none;">
    <div class="field">
      <label>Pages per sheet</label>
      <select id="nVal">
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="6">6</option>
        <option value="9">9</option>
      </select>
    </div>
    <button class="calc-btn" id="runBtn">Create N-up PDF</button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<div class="download-box" id="downloadBox">
  <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
  <span class="name" id="downloadName">Ready</span>
  <a id="downloadLink" download>Download</a>
</div>

    </div>
    <aside class="side-card" id="calcSidebar"></aside>
  </div>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/pdftool-common.js"></script>
<script>
  let bytes = null;
  const LAYOUTS = { 2:[2,1], 4:[2,2], 6:[3,2], 9:[3,3] };
  setupDropzone('dropzone','fileInput', async (file) => {
    document.getElementById('fileInfo').style.display='flex';
    document.getElementById('fileName').textContent = file.name + ' • ' + formatBytes(file.size);
    document.getElementById('dropzone').style.display='none';
    bytes = await file.arrayBuffer();
    document.getElementById('opts').style.display='block';
  });
  document.getElementById('removeFile').addEventListener('click', () => location.reload());
  document.getElementById('runBtn').addEventListener('click', async () => {
    const bar = document.getElementById('progressBar'); document.getElementById('progressFill').style.width='30%'; bar.classList.add('show');
    const n = parseInt(document.getElementById('nVal').value);
    const [cols, rows] = LAYOUTS[n];
    const srcDoc = await PDFLib.PDFDocument.load(bytes);
    const newDoc = await PDFLib.PDFDocument.create();
    const sheetW = 841.89, sheetH = 595.28; // A4 landscape
    const cellW = sheetW / cols, cellH = sheetH / rows;
    const indices = srcDoc.getPageIndices();
    for (let i = 0; i < indices.length; i += n) {
      const sheet = newDoc.addPage([sheetW, sheetH]);
      const group = indices.slice(i, i + n);
      for (let j = 0; j < group.length; j++) {
        const [srcPage] = await newDoc.copyPages(srcDoc, [group[j]]);
        const embedded = await newDoc.embedPage(srcPage);
        const { width: ow, height: oh } = srcPage.getSize();
        const s = Math.min(cellW/ow, cellH/oh) * 0.95;
        const col = j % cols, row = Math.floor(j / cols);
        const x = col*cellW + (cellW - ow*s)/2;
        const y = sheetH - (row+1)*cellH + (cellH - oh*s)/2;
        sheet.drawPage(embedded, { x, y, width: ow*s, height: oh*s });
      }
      document.getElementById('progressFill').style.width = Math.round(20 + 70*(i/indices.length)) + '%';
    }
    const out = await newDoc.save();
    document.getElementById('progressFill').style.width='100%';
    const blob = new Blob([out], {type:'application/pdf'});
    triggerDownload(blob, 'n-up.pdf');
    document.getElementById('downloadBox').classList.add('show');
    document.getElementById('downloadName').textContent = 'n-up.pdf';
    document.getElementById('downloadLink').href = URL.createObjectURL(blob);
  });
  </script>
</body>
</html>
