<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Resize Page Size | FreemiumPDF</title>
<meta name="description" content="Resize PDF pages to A4, Letter, Legal or a custom size, free and in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/pdftool.css">
<link rel="canonical" href="https://freemiumpdf.netlify.app/tools/pdf-tools/resize-pages.html">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="https://freemiumpdf.netlify.app/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/global-footer.css">
</head>
<body data-tool="resize">
<div class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand-link"><span class="brand-mark"><i class="fa-solid fa-wrench"></i></span> FreemiumPDF</a>
    <span class="crumb">/ PDF Tools / Resize Page Size</span>
  </div>
</div>
<main class="page-wrap" style="max-width:1100px;">
  <div class="calc-head">
    <h1>Resize Page Size</h1>
    <p>Change every page of your PDF to a standard or custom paper size.</p>
  </div>
  <div class="calc-layout">
    <div class="calc-card">
<div class="dropzone" id="dropzone">
  <i class="fa-solid fa-file-arrow-up" style="font-size:28px;color:var(--blue-600);margin-bottom:10px;"></i>
  <p><strong>Click to upload</strong> or drag &amp; drop a PDF file</p>
  <button type="button" class="dropzone-browse-btn">Browse Files</button>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
</div>
<div class="file-info" id="fileInfo" style="display:none;">
  <i class="fa-solid fa-file-pdf" style="color:var(--red)"></i>
  <span id="fileName"></span>
  <button class="remove" id="removeFile">Remove</button>
</div>

  <div id="opts" style="display:none;">
    <div class="field">
      <label>Target size</label>
      <select id="preset">
        <option value="a4">A4 (210 x 297 mm)</option>
        <option value="letter">Letter (8.5 x 11 in)</option>
        <option value="legal">Legal (8.5 x 14 in)</option>
        <option value="a3">A3 (297 x 420 mm)</option>
        <option value="custom">Custom (points)</option>
      </select>
    </div>
    <div class="field-row" id="customRow" style="display:none;">
      <div class="field"><label>Width (pt)</label><input type="number" id="customW" value="595"></div>
      <div class="field"><label>Height (pt)</label><input type="number" id="customH" value="842"></div>
    </div>
    <div class="field">
      <label>Fit mode</label>
      <select id="fitMode">
        <option value="fit">Scale to fit (keep proportions)</option>
        <option value="stretch">Stretch to fill</option>
      </select>
    </div>
    <button class="calc-btn" id="runBtn">Resize PDF</button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<div class="download-box" id="downloadBox">
  <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
  <span class="name" id="downloadName">Ready</span>
  <a id="downloadLink" download>Download</a>
</div>

    </div>
    <aside class="side-card" id="calcSidebar"></aside>
  </div>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/pdftool-common.js"></script>
<script>
  let bytes = null;
  const PRESETS = { a4:[595.28,841.89], letter:[612,792], legal:[612,1008], a3:[841.89,1190.55] };
  setupDropzone('dropzone','fileInput', async (file) => {
    document.getElementById('fileInfo').style.display='flex';
    document.getElementById('fileName').textContent = file.name + ' • ' + formatBytes(file.size);
    document.getElementById('dropzone').style.display='none';
    bytes = await file.arrayBuffer();
    document.getElementById('opts').style.display='block';
  });
  document.getElementById('removeFile').addEventListener('click', () => location.reload());
  document.getElementById('preset').addEventListener('change', (e) => {
    document.getElementById('customRow').style.display = e.target.value === 'custom' ? 'grid' : 'none';
  });
  document.getElementById('runBtn').addEventListener('click', async () => {
    const bar = document.getElementById('progressBar'); document.getElementById('progressFill').style.width='40%'; bar.classList.add('show');
    const presetKey = document.getElementById('preset').value;
    let [tw, th] = presetKey === 'custom'
      ? [parseFloat(document.getElementById('customW').value)||595, parseFloat(document.getElementById('customH').value)||842]
      : PRESETS[presetKey];
    const fitMode = document.getElementById('fitMode').value;
    const srcDoc = await PDFLib.PDFDocument.load(bytes);
    const newDoc = await PDFLib.PDFDocument.create();
    const pages = await newDoc.copyPages(srcDoc, srcDoc.getPageIndices());
    for (const p of pages) {
      const embedded = await newDoc.embedPage(p);
      const newPage = newDoc.addPage([tw, th]);
      const { width: ow, height: oh } = p.getSize();
      let scaleX = tw/ow, scaleY = th/oh, x=0, y=0, w=tw, h=th;
      if (fitMode === 'fit') {
        const s = Math.min(scaleX, scaleY);
        w = ow*s; h = oh*s; x = (tw-w)/2; y = (th-h)/2;
        newPage.drawPage(embedded, { x, y, width: w, height: h });
      } else {
        newPage.drawPage(embedded, { x:0, y:0, width: tw, height: th });
      }
    }
    const out = await newDoc.save();
    document.getElementById('progressFill').style.width='100%';
    triggerDownload(new Blob([out], {type:'application/pdf'}), 'resized.pdf');
    document.getElementById('downloadBox').classList.add('show');
    document.getElementById('downloadName').textContent = 'resized.pdf';
    document.getElementById('downloadLink').href = URL.createObjectURL(new Blob([out], {type:'application/pdf'}));
  });
  </script>
</body>
</html>
