<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Extract Images from PDF | FreemiumPDF</title>
<meta name="description" content="Extract all images from a PDF file, free and in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/pdftool.css">
<link rel="canonical" href="https://freemiumpdf.netlify.app/tools/pdf-tools/extract-images.html">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="https://freemiumpdf.netlify.app/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/global-footer.css">
</head>
<body data-tool="extractimg">
<div class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand-link"><span class="brand-mark"><i class="fa-solid fa-wrench"></i></span> FreemiumPDF</a>
    <span class="crumb">/ PDF Tools / Extract Images from PDF</span>
  </div>
</div>
<main class="page-wrap" style="max-width:1100px;">
  <div class="calc-head">
    <h1>Extract Images from PDF</h1>
    <p>Pull every embedded image out of your PDF as a ZIP of PNG files.</p>
  </div>
  <div class="calc-layout">
    <div class="calc-card">
<div class="dropzone" id="dropzone">
  <i class="fa-solid fa-file-arrow-up" style="font-size:28px;color:var(--blue-600);margin-bottom:10px;"></i>
  <p><strong>Click to upload</strong> or drag &amp; drop a PDF file</p>
  <button type="button" class="dropzone-browse-btn">Browse Files</button>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
</div>
<div class="file-info" id="fileInfo" style="display:none;">
  <i class="fa-solid fa-file-pdf" style="color:var(--red)"></i>
  <span id="fileName"></span>
  <button class="remove" id="removeFile">Remove</button>
</div>
<div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<div class="download-box" id="downloadBox">
  <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
  <span class="name" id="downloadName">Ready</span>
  <a id="downloadLink" download>Download</a>
</div>

    </div>
    <aside class="side-card" id="calcSidebar"></aside>
  </div>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/pdftool-common.js"></script>
<script src="vendor/jszip.min.js"></script>
  <script type="module">
  import { pdfjsLib, loadPdfJsDoc } from './js/pdftool-render.mjs';
  setupDropzone('dropzone','fileInput', async (file) => {
    document.getElementById('fileInfo').style.display='flex';
    document.getElementById('fileName').textContent = file.name + ' • ' + formatBytes(file.size);
    document.getElementById('dropzone').style.display='none';
    const bar = document.getElementById('progressBar'); document.getElementById('progressFill').style.width='20%'; bar.classList.add('show');
    const bytes = await file.arrayBuffer();
    const pdfjsDoc = await loadPdfJsDoc(bytes);
    const zip = new JSZip();
    let found = 0;
    for (let i = 1; i <= pdfjsDoc.numPages; i++) {
      const page = await pdfjsDoc.getPage(i);
      const opList = await page.getOperatorList();
      const names = new Set();
      opList.fnArray.forEach((fn, idx) => {
        if (fn === pdfjsLib.OPS.paintImageXObject || fn === pdfjsLib.OPS.paintImageXObjectRepeat) {
          names.add(opList.argsArray[idx][0]);
        }
      });
      for (const name of names) {
        try {
          const img = await new Promise((resolve, reject) => {
            page.objs.get(name, resolve);
          });
          if (!img || !img.width) continue;
          const canvas = document.createElement('canvas');
          canvas.width = img.width; canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          const imgData = ctx.createImageData(img.width, img.height);
          if (img.data.length === imgData.data.length) {
            imgData.data.set(img.data);
          } else {
            const bitmap = img; // ImageBitmap case
            ctx.drawImage(bitmap, 0, 0);
          }
          if (img.data && img.data.length === imgData.data.length) ctx.putImageData(imgData, 0, 0);
          const blobData = await new Promise(res => canvas.toBlob(res, 'image/png'));
          if (blobData) { zip.file('page' + i + '-' + name + '.png', blobData); found++; }
        } catch (e) { /* skip image that can't be decoded */ }
      }
      document.getElementById('progressFill').style.width = Math.round(20 + 70*(i/pdfjsDoc.numPages)) + '%';
    }
    document.getElementById('progressFill').style.width='100%';
    if (found === 0) {
      document.getElementById('downloadBox').classList.add('show');
      document.getElementById('downloadName').textContent = 'No embedded images found in this PDF.';
      return;
    }
    const zipBlob = await zip.generateAsync({type:'blob'});
    const name = file.name.replace(/\.pdf$/i,'') + '-images.zip';
    triggerDownload(zipBlob, name);
    document.getElementById('downloadBox').classList.add('show');
    document.getElementById('downloadName').textContent = name + ' (' + found + ' images)';
    document.getElementById('downloadLink').href = URL.createObjectURL(zipBlob);
    document.getElementById('downloadLink').download = name;
  });
  document.getElementById('removeFile').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
