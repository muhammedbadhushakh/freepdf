<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Add Header/Footer | FreemiumPDF</title>
<meta name="description" content="Add a header or footer with page numbers to a PDF, free and in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/pdftool.css">
<link rel="canonical" href="https://freemiumpdf.netlify.app/tools/pdf-tools/add-header-footer.html">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="https://freemiumpdf.netlify.app/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/global-footer.css">
</head>
<body data-tool="headerfooter">
<div class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand-link"><span class="brand-mark"><i class="fa-solid fa-wrench"></i></span> FreemiumPDF</a>
    <span class="crumb">/ PDF Tools / Add Header/Footer</span>
  </div>
</div>
<main class="page-wrap" style="max-width:1100px;">
  <div class="calc-head">
    <h1>Add Header/Footer</h1>
    <p>Add a text header and/or footer to every page of your PDF.</p>
  </div>
  <div class="calc-layout">
    <div class="calc-card">
<div class="dropzone" id="dropzone">
  <i class="fa-solid fa-file-arrow-up" style="font-size:28px;color:var(--blue-600);margin-bottom:10px;"></i>
  <p><strong>Click to upload</strong> or drag &amp; drop a PDF file</p>
  <button type="button" class="dropzone-browse-btn">Browse Files</button>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
</div>
<div class="file-info" id="fileInfo" style="display:none;">
  <i class="fa-solid fa-file-pdf" style="color:var(--red)"></i>
  <span id="fileName"></span>
  <button class="remove" id="removeFile">Remove</button>
</div>

  <div id="opts" style="display:none;">
    <div class="field"><label>Header text (optional)</label><input type="text" id="headerText" placeholder="e.g. Company Name"></div>
    <div class="field"><label>Footer text (optional, use {page} and {total})</label><input type="text" id="footerText" placeholder="Page {page} of {total}" value="Page {page} of {total}"></div>
    <div class="field-row">
      <div class="field"><label>Font size</label><input type="number" id="fontSize" value="10" min="6" max="24"></div>
      <div class="field"><label>Margin (pt)</label><input type="number" id="marginPt" value="28" min="10" max="80"></div>
    </div>
    <button class="calc-btn" id="runBtn">Add header/footer</button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<div class="download-box" id="downloadBox">
  <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
  <span class="name" id="downloadName">Ready</span>
  <a id="downloadLink" download>Download</a>
</div>

    </div>
    <aside class="side-card" id="calcSidebar"></aside>
  </div>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/pdftool-common.js"></script>
<script>
  let bytes = null;
  setupDropzone('dropzone','fileInput', async (file) => {
    document.getElementById('fileInfo').style.display='flex';
    document.getElementById('fileName').textContent = file.name + ' • ' + formatBytes(file.size);
    document.getElementById('dropzone').style.display='none';
    bytes = await file.arrayBuffer();
    document.getElementById('opts').style.display='block';
  });
  document.getElementById('removeFile').addEventListener('click', () => location.reload());
  document.getElementById('runBtn').addEventListener('click', async () => {
    const bar = document.getElementById('progressBar'); document.getElementById('progressFill').style.width='40%'; bar.classList.add('show');
    const doc = await PDFLib.PDFDocument.load(bytes);
    const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    const size = parseFloat(document.getElementById('fontSize').value)||10;
    const margin = parseFloat(document.getElementById('marginPt').value)||28;
    const headerTpl = document.getElementById('headerText').value;
    const footerTpl = document.getElementById('footerText').value;
    const pages = doc.getPages();
    const total = pages.length;
    pages.forEach((p, i) => {
      const { width, height } = p.getSize();
      if (headerTpl) {
        const text = headerTpl.replaceAll('{page}', i+1).replaceAll('{total}', total);
        p.drawText(text, { x: margin, y: height - margin + 8, size, font, color: PDFLib.rgb(0.2,0.2,0.25) });
      }
      if (footerTpl) {
        const text = footerTpl.replaceAll('{page}', i+1).replaceAll('{total}', total);
        const w = font.widthOfTextAtSize(text, size);
        p.drawText(text, { x: (width-w)/2, y: margin - 16, size, font, color: PDFLib.rgb(0.2,0.2,0.25) });
      }
    });
    const out = await doc.save();
    document.getElementById('progressFill').style.width='100%';
    const blob = new Blob([out], {type:'application/pdf'});
    triggerDownload(blob, 'with-header-footer.pdf');
    document.getElementById('downloadBox').classList.add('show');
    document.getElementById('downloadName').textContent = 'with-header-footer.pdf';
    document.getElementById('downloadLink').href = URL.createObjectURL(blob);
  });
  </script>
</body>
</html>
