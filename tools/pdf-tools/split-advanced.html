<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Split by Bookmarks/Size | FreemiumPDF</title>
<meta name="description" content="Split a PDF by its bookmark outline or by a target file size, free and in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
<link rel="stylesheet" href="css/pdftool.css">
<link rel="canonical" href="https://freemiumpdf.netlify.app/tools/pdf-tools/split-advanced.html">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="https://freemiumpdf.netlify.app/assets/favicon-32.png">
<link rel="stylesheet" href="/assets/global-footer.css">
</head>
<body data-tool="splitadv">
<div class="topbar">
  <div class="topbar-inner">
    <a href="../../index.html" class="brand-link"><span class="brand-mark"><i class="fa-solid fa-wrench"></i></span> FreemiumPDF</a>
    <span class="crumb">/ PDF Tools / Split by Bookmarks/Size</span>
  </div>
</div>
<main class="page-wrap" style="max-width:1100px;">
  <div class="calc-head">
    <h1>Split by Bookmarks/Size</h1>
    <p>Split a PDF using its bookmarks (outline), or into chunks under a target size.</p>
  </div>
  <div class="calc-layout">
    <div class="calc-card">
<div class="dropzone" id="dropzone">
  <i class="fa-solid fa-file-arrow-up" style="font-size:28px;color:var(--blue-600);margin-bottom:10px;"></i>
  <p><strong>Click to upload</strong> or drag &amp; drop a PDF file</p>
  <button type="button" class="dropzone-browse-btn">Browse Files</button>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
</div>
<div class="file-info" id="fileInfo" style="display:none;">
  <i class="fa-solid fa-file-pdf" style="color:var(--red)"></i>
  <span id="fileName"></span>
  <button class="remove" id="removeFile">Remove</button>
</div>

  <div id="opts" style="display:none;">
    <div class="field">
      <label>Split method</label>
      <select id="method">
        <option value="bookmarks">By top-level bookmarks (outline)</option>
        <option value="size">By target size (MB per file)</option>
      </select>
    </div>
    <div class="field" id="sizeField" style="display:none;">
      <label>Target size per file (MB)</label>
      <input type="number" id="targetMB" value="2" min="0.2" step="0.2">
    </div>
    <p class="hint" id="statusHint"></p>
    <button class="calc-btn" id="runBtn">Split PDF</button>
  </div>
  <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
<div class="download-box" id="downloadBox">
  <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
  <span class="name" id="downloadName">Ready</span>
  <a id="downloadLink" download>Download</a>
</div>

    </div>
    <aside class="side-card" id="calcSidebar"></aside>
  </div>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/pdftool-common.js"></script>
<script src="vendor/jszip.min.js"></script>
  <script type="module">
  import { loadPdfJsDoc } from './js/pdftool-render.mjs';
  let bytes = null;
  setupDropzone('dropzone','fileInput', async (file) => {
    document.getElementById('fileInfo').style.display='flex';
    document.getElementById('fileName').textContent = file.name + ' • ' + formatBytes(file.size);
    document.getElementById('dropzone').style.display='none';
    bytes = await file.arrayBuffer();
    document.getElementById('opts').style.display='block';
  });
  document.getElementById('removeFile').addEventListener('click', () => location.reload());
  document.getElementById('method').addEventListener('change', e => {
    document.getElementById('sizeField').style.display = e.target.value === 'size' ? 'block' : 'none';
  });
  async function getBookmarkRanges() {
    const pdfjsDoc = await loadPdfJsDoc(bytes.slice(0));
    const outline = await pdfjsDoc.getOutline();
    const total = pdfjsDoc.numPages;
    if (!outline || !outline.length) return null;
    const starts = [];
    for (const item of outline) {
      let dest = item.dest;
      if (typeof dest === 'string') dest = await pdfjsDoc.getDestination(dest);
      if (!dest) continue;
      const pageIndex = await pdfjsDoc.getPageIndex(dest[0]);
      starts.push({ title: item.title || 'section', page: pageIndex });
    }
    starts.sort((a,b)=>a.page-b.page);
    const uniq = [];
    starts.forEach(s => { if (!uniq.length || uniq[uniq.length-1].page !== s.page) uniq.push(s); });
    if (!uniq.length) return null;
    const ranges = uniq.map((s, i) => ({
      title: s.title, start: s.page, end: (i+1 < uniq.length ? uniq[i+1].page - 1 : total - 1)
    }));
    return ranges;
  }
  document.getElementById('runBtn').addEventListener('click', async () => {
    const bar = document.getElementById('progressBar'); document.getElementById('progressFill').style.width='30%'; bar.classList.add('show');
    const method = document.getElementById('method').value;
    const srcDoc = await PDFLib.PDFDocument.load(bytes);
    const n = srcDoc.getPageCount();
    const zip = new JSZip();
    let ranges = [];
    if (method === 'bookmarks') {
      ranges = await getBookmarkRanges();
      if (!ranges) {
        document.getElementById('statusHint').textContent = 'No bookmarks found in this PDF — splitting into one file per 10 pages instead.';
        for (let i=0;i<n;i+=10) ranges.push({title:'part', start:i, end:Math.min(i+9,n-1)});
      }
    } else {
      const targetMB = parseFloat(document.getElementById('targetMB').value) || 2;
      const avgPerPage = bytes.byteLength / n;
      const pagesPerChunk = Math.max(1, Math.floor((targetMB*1024*1024) / avgPerPage));
      for (let i=0;i<n;i+=pagesPerChunk) ranges.push({title:'part', start:i, end:Math.min(i+pagesPerChunk-1,n-1)});
    }
    for (let i = 0; i < ranges.length; i++) {
      const r = ranges[i];
      const idxs = []; for (let p=r.start;p<=r.end;p++) idxs.push(p);
      const newDoc = await PDFLib.PDFDocument.create();
      const pages = await newDoc.copyPages(srcDoc, idxs);
      pages.forEach(p => newDoc.addPage(p));
      const out = await newDoc.save();
      const safeTitle = (r.title || 'part').replace(/[^a-z0-9]+/gi,'-').slice(0,40);
      zip.file(String(i+1).padStart(2,'0') + '-' + safeTitle + '.pdf', out);
      document.getElementById('progressFill').style.width = Math.round(20 + 70*(i/ranges.length)) + '%';
    }
    const zipBlob = await zip.generateAsync({type:'blob'});
    document.getElementById('progressFill').style.width='100%';
    triggerDownload(zipBlob, 'split-parts.zip');
    document.getElementById('downloadBox').classList.add('show');
    document.getElementById('downloadName').textContent = 'split-parts.zip (' + ranges.length + ' files)';
    document.getElementById('downloadLink').href = URL.createObjectURL(zipBlob);
    document.getElementById('downloadLink').download = 'split-parts.zip';
  });
  </script>
</body>
</html>
